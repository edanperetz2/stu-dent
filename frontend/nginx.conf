server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback -- client-side React Router routes must resolve to
    # index.html, or a direct hit/refresh on e.g. /appointments 404s here.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
