<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stu-Dent</title>
    <!-- Vite is a plain client-rendered SPA, so Mantine's <ColorSchemeScript>
         React component (meant for SSR frameworks to render server-side)
         doesn't apply -- this is the same script it would inject, added by
         hand: sets the color scheme attribute before React mounts, so
         there's no flash of the wrong theme on load. Must match
         MantineProvider's defaultColorScheme="auto" in App.tsx and
         localStorage key "mantine-color-scheme-value" (Mantine's default). -->
    <script>
      try {
        var stored = window.localStorage.getItem('mantine-color-scheme-value')
        var scheme = stored === 'light' || stored === 'dark' || stored === 'auto' ? stored : 'auto'
        var resolved =
          scheme !== 'auto'
            ? scheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-mantine-color-scheme', resolved)
      } catch (e) {}
    </script>
    <!-- This tiny pre-bundle canvas style is intentionally duplicated by
         index.css. It applies before Vite downloads any JavaScript/CSS, so a
         light app never exposes the browser's dark OS-default canvas during
         the full-page return from Google (and vice versa). -->
    <style>
      html[data-mantine-color-scheme='light'],
      html[data-mantine-color-scheme='light'] body {
        background: #fff;
        color-scheme: light;
      }
      html[data-mantine-color-scheme='dark'],
      html[data-mantine-color-scheme='dark'] body {
        background: #1a1b1e;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
