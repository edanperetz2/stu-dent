name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend lint deps
        working-directory: backend
        run: pip install --require-hashes -r requirements-dev.lock.txt

      - name: Ruff check
        working-directory: backend
        run: ruff check .

      - name: Black check
        working-directory: backend
        run: black --check .

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Oxlint
        working-directory: frontend
        run: npm run lint

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install --require-hashes -r requirements-dev.lock.txt

      - name: pip-audit
        working-directory: backend
        run: pipx run pip-audit -r requirements.lock.txt -r requirements-dev.lock.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: npm audit
        working-directory: frontend
        # GHSA-qwww-vcr4-c8h2 (react-router, CSRF in *unstable RSC* code
        # paths only -- confirmed via the advisory itself) is reviewed and
        # allowlisted below: this is a plain client-rendered Vite SPA that
        # never uses React Router's RSC APIs, and the real fix (8.3.0)
        # isn't published to npm yet -- the only "fix" `npm audit` offers
        # today is a real regression (react-router-dom 7.11.0, losing many
        # months of point releases). Revisit once 8.3.0+ ships. Any other
        # high/critical finding still fails this step.
        run: |
          npm audit --audit-level=high --json > audit.json || true
          node -e "
            const data = require('./audit.json');
            const allowed = new Set(['https://github.com/advisories/GHSA-qwww-vcr4-c8h2']);
            const unexpected = [];
            for (const v of Object.values(data.vulnerabilities || {})) {
              for (const via of v.via || []) {
                if (typeof via === 'object' && via.url && !allowed.has(via.url)) unexpected.push(via.url);
              }
            }
            if (unexpected.length) {
              console.error('Unreviewed high/critical advisories:', unexpected);
              process.exit(1);
            }
            console.log('Only reviewed/allowlisted advisories present.');
          "

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: stu_dent
          POSTGRES_PASSWORD: stu_dent
          POSTGRES_DB: stu_dent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stu_dent -d stu_dent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://stu_dent:stu_dent@localhost:5432/stu_dent_test
      JWT_SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install --require-hashes -r requirements-dev.lock.txt

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Alembic downgrade/upgrade round trip
        working-directory: backend
        # Exercises every migration's downgrade() path, not just upgrade()
        # -- a downgrade bug (unnamed constraints, a type already existing,
        # etc.) previously went unnoticed specifically because nothing in
        # this pipeline ever ran `alembic downgrade` at all.
        run: alembic downgrade base && alembic upgrade head

      - name: Run pytest
        working-directory: backend
        run: pytest -v

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Vitest
        working-directory: frontend
        run: npm run test

      - name: Build (tsc + vite build)
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: stu-dent-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: stu-dent-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
