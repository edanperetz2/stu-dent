name: Deploy to VM

# Manual only -- never triggers on push/pull_request. Structurally inert
# until VM_HOST/VM_USER/VM_SSH_KEY secrets are configured (see the
# "Deploying to the course VM" section of the README), so this can't run
# by accident even once the file exists on master.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/stu-dent
            git pull
            docker compose -f docker-compose.prod.yml up -d --build
