services:
  db:
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not bound to 127.0.0.1 (unlike ollama below) -- tried it, but a
    # 127.0.0.1:5432 binding failed outright on at least one real dev
    # machine in this project because of a pre-existing native Postgres
    # service already on port 5432; the plain 0.0.0.0 form below
    # coexisted with it without issue. Traded the LAN-exposure hardening
    # for not risking every contributor's/the lecturer's own machine
    # hitting the same conflict on first run.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    # Shared with worker below so Compose builds the backend image once and
    # reuses it for both containers, instead of building the same image
    # twice under two different auto-generated tags.
    image: stu-dent-backend:local
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build: ./backend
    image: stu-dent-backend:local
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./backend:/app
    command: python -m app.worker

  ollama:
    image: ollama/ollama@sha256:509fdf54e23bd50d87af646cb51c0a7a203d6a83cc4d6695b3b08c5be1c62c0a
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Bound to localhost only -- same reasoning as db's port above. Ollama
    # has no authentication of its own, so an unbound port would let
    # anyone reachable on the LAN use (or resource-exhaust) the local LLM.
    ports:
      - "127.0.0.1:11434:11434"

  # One-shot: waits for the ollama server to accept requests, then pulls
  # OLLAMA_MODEL. Runs on every `up` but is idempotent/fast once the model
  # is cached in ollama_data -- this replaces a manual `ollama pull` step
  # that was easy to forget (a forgotten pull silently degrades every AI
  # feature to its fallback path forever, with no error -- see
  # ollama_client.py's best-effort contract).
  ollama-init:
    image: ollama/ollama@sha256:509fdf54e23bd50d87af646cb51c0a7a203d6a83cc4d6695b3b08c5be1c62c0a
    depends_on:
      ollama:
        condition: service_started
    env_file: .env
    environment:
      OLLAMA_HOST: ollama:11434
    # The ${OLLAMA_MODEL:-llama3.2} fallback mirrors config.py's Python
    # default -- protects against a stale .env (missing a key that
    # .env.example has since gained) leaving this pull with an empty model
    # name, which fails outright instead of degrading gracefully like the
    # rest of the app's Ollama integration does.
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull \"$${OLLAMA_MODEL:-llama3.2}\""]
    restart: "no"

  # One-shot: seeds idempotent demo data once the api is actually healthy
  # (migrations have already run by then). Opt-out via SEED_DEMO_ON_START=
  # false in .env, e.g. for a from-scratch course-submission run or real
  # testing against a genuinely empty DB. seed_demo.py already no-ops if
  # the demo sentinel account exists and prints every seeded login to its
  # own stdout, so `docker compose logs seed-init` (or the plain console
  # during `up`) is where to read the credentials.
  seed-init:
    image: stu-dent-backend:local
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    entrypoint: ["/bin/sh", "-c", "if [ \"$${SEED_DEMO_ON_START:-false}\" = \"true\" ]; then python -m app.seed_demo; else echo 'SEED_DEMO_ON_START is not true -- skipping demo seed'; fi"]
    restart: "no"

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailhog:
    image: mailhog/mailhog@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  ollama_data:
