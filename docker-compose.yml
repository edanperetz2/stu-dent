x-env-files: &env-files
  # Shared development defaults make a clean checkout runnable with plain
  # `docker compose up --build`. A git-ignored .env, when present, is loaded
  # second and overrides any value for local or production-like testing.
  - path: .env.example
  - path: .env
    required: false

services:
  db:
    image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    restart: unless-stopped
    env_file: *env-files
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not bound to 127.0.0.1 (unlike ollama below) -- tried it, but a
    # 127.0.0.1:5432 binding failed outright on at least one real dev
    # machine in this project because of a pre-existing native Postgres
    # service already on port 5432; the plain 0.0.0.0 form below
    # coexisted with it without issue. Traded the LAN-exposure hardening
    # for not risking every contributor's/the lecturer's own machine
    # hitting the same conflict on first run.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    # Shared with worker below so Compose builds the backend image once and
    # reuses it for both containers, instead of building the same image
    # twice under two different auto-generated tags.
    image: stu-dent-backend:local
    restart: unless-stopped
    env_file: *env-files
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build: ./backend
    image: stu-dent-backend:local
    restart: unless-stopped
    env_file: *env-files
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m app.worker

  ollama:
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Bound to localhost only -- same reasoning as db's port above. Ollama
    # has no authentication of its own, so an unbound port would let
    # anyone reachable on the LAN use (or resource-exhaust) the local LLM.
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: pulls OLLAMA_MODEL once the ollama server is actually healthy.
  # Runs on every `up` but is idempotent/fast once the model is cached in
  # ollama_data -- this replaces a manual `ollama pull` step that was easy
  # to forget (a forgotten pull silently degrades every AI feature to its
  # fallback path forever, with no error -- see ollama_client.py's
  # best-effort contract). `timeout 900` turns a stalled/stuck download
  # into a clear, bounded failure instead of an indefinite silent hang.
  ollama-init:
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    depends_on:
      ollama:
        condition: service_healthy
    env_file: *env-files
    environment:
      OLLAMA_HOST: ollama:11434
    # The ${OLLAMA_MODEL:-llama3.2} fallback mirrors config.py's Python
    # default -- protects against a stale .env (missing a key that
    # .env.example has since gained) leaving this pull with an empty model
    # name, which fails outright instead of degrading gracefully like the
    # rest of the app's Ollama integration does.
    entrypoint: ["/bin/sh", "-c", "timeout 900 ollama pull \"$${OLLAMA_MODEL:-llama3.2}\""]
    restart: "no"

  # One-shot: seeds idempotent demo data once the api is actually healthy
  # (migrations have already run by then). Opt-out via SEED_DEMO_ON_START=
  # false in .env, e.g. for a from-scratch course-submission run or real
  # testing against a genuinely empty DB. seed_demo.py already no-ops if
  # the demo sentinel account exists and prints every seeded login to its
  # own stdout, so `docker compose logs seed-init` (or the plain console
  # during `up`) is where to read the credentials.
  #
  # The ${SEED_DEMO_ON_START:-false} fallback deliberately does NOT match
  # .env.example's shipped default of true -- if the key is ever missing
  # from .env entirely (a stale .env predating this key, same class of gap
  # ollama-init hit earlier), this fails closed to "don't seed" rather than
  # silently seeding demo accounts into a possibly-real database.
  #
  # required: false on ollama-init lets seed-init wait for it when possible
  # (so seed_demo.py's report-narration step has a real model to call,
  # instead of racing ahead and getting the same-as-always graceful
  # fallback) without making demo data depend on Ollama succeeding at all --
  # matches ollama_client.py's own best-effort, never-block contract.
  seed-init:
    image: stu-dent-backend:local
    depends_on:
      api:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
        required: false
    env_file: *env-files
    volumes:
      - ./backend:/app
    entrypoint: ["/bin/sh", "-c", "if [ \"$${SEED_DEMO_ON_START:-false}\" = \"true\" ]; then python -m app.seed_demo; else echo 'SEED_DEMO_ON_START is not true -- skipping demo seed'; fi"]
    restart: "no"

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: *env-files
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailhog:
    image: mailhog/mailhog@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  ollama_data:
